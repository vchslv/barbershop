services:
  backend:
    build:
      context: ./backend
    container_name: barbershop-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      LOG_CHANNEL: stderr
    volumes:
      - backend_data:/data
      - backend_storage:/var/www/html/storage/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://127.0.0.1:8000/api/services') !== false || exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
    container_name: barbershop-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_storage:
